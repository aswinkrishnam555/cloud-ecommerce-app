{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">🛒 Your Cart</h2>
{% if cart_items %}
<table class="table">
  <thead>
    <tr><th>Product</th><th>Price</th></tr>
  </thead>
  <tbody>
    {% for item in cart_items %}
    <tr>
      <td>{{ item.name }}</td>
      <td>₹{{ item.price }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>Your cart is empty. <a href="/">Shop now</a></p>
{% endif %}
{% endblock %}
